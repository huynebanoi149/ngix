events {}

http {

    server {
        listen 10000;

        location / {
            return 200 "Nginx is running on Render!";
        }

        location /hls/ {

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /usr/share/nginx/html;

            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }

}