events {}

http {
    server {
        listen 10000;

        location / {
            return 200 "Nginx is running on Render!";
        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                1772625711394.mp4/mp2t ts;
            }

            root /usr/share/nginx/html;
        }
    }
}